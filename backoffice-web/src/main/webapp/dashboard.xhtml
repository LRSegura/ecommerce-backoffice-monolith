<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="template.xhtml">

    <ui:define name="content">
        <h:form>
            <div class="dashboard-container">
                <h1 style="margin-top:0">Dashboard General</h1>

                <div class="dashboard-grid">

                    <div class="card dashboard-card">
                        <div class="card-content">
                            <i class="pi pi-box card-icon" style="color: #3B82F6; background: #DBEAFE;"></i>
                            <div class="card-text">
                                <span class="card-title">Productos</span>
                                <span class="card-value">#{dashboardController.productCount}</span>
                            </div>
                        </div>
                    </div>

                    <div class="card dashboard-card">
                        <div class="card-content">
                            <i class="pi pi-tag card-icon" style="color: #10B981; background: #D1FAE5;"></i>
                            <div class="card-text">
                                <span class="card-title">Marcas</span>
                                <span class="card-value">#{dashboardController.brandCount}</span>
                            </div>
                        </div>
                    </div>

                    <div class="card dashboard-card">
                        <div class="card-content">
                            <i class="pi pi-list card-icon" style="color: #F59E0B; background: #FEF3C7;"></i>
                            <div class="card-text">
                                <span class="card-title">Categorías</span>
                                <span class="card-value">#{dashboardController.categoryCount}</span>
                            </div>
                        </div>
                    </div>

                    <div class="card dashboard-card">
                        <div class="card-content">
                            <i class="pi pi-shopping-cart card-icon" style="color: #EF4444; background: #FEE2E2;"></i>
                            <div class="card-text">
                                <span class="card-title">Pedidos Hoy</span>
                                <span class="card-value">0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card" style="margin-top: 2rem;">
                    <h3>Actividad Reciente</h3>
                    <p>Aquí podrías colocar un gráfico de PrimeFaces o una tabla de últimas transacciones.</p>
                </div>
            </div>

            <style>
                .dashboard-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                    gap: 1.5rem;
                }
                .dashboard-card {
                    padding: 1.5rem;
                    border-left: 5px solid transparent;
                    transition: transform 0.2s;
                }
                .dashboard-card:hover {
                    transform: translateY(-5px);
                }
                .card-content {
                    display: flex;
                    align-items: center;
                }
                .card-icon {
                    font-size: 2rem;
                    padding: 1rem;
                    border-radius: 50%;
                    margin-right: 1.5rem;
                }
                .card-text {
                    display: flex;
                    flex-direction: column;
                }
                .card-title {
                    font-size: 0.9rem;
                    color: #6B7280;
                    font-weight: 600;
                    text-transform: uppercase;
                }
                .card-value {
                    font-size: 1.8rem;
                    font-weight: bold;
                    color: #111827;
                }
            </style>
        </h:form>
    </ui:define>
</ui:composition>
