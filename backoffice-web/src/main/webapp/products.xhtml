<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="template.xhtml">

    <ui:define name="content">
        <h:form id="form">
            <p:growl id="messages" showDetail="true"/>

            <div class="card">
                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton value="New Product" icon="pi pi-plus"
                                         actionListener="#{productController.prepareNewProduct}"
                                         update=":mainTabs:dialogs:manage-product-content :mainTabs:dialogs:dialog-footer"
                                         oncomplete="PF('manageProductDialog').show()"
                                         styleClass="ui-button-success" style="margin-right: .5rem"/>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="dt-products" var="product" value="#{productController.products}"
                             stripedRows="true" paginator="true" rows="10" rowKey="#{product.id}" paginatorPosition="bottom">

                    <p:column headerText="SKU" sortBy="#{product.sku}" filterBy="#{product.sku}">
                        <h:outputText value="#{product.sku}"/>
                    </p:column>

                    <p:column headerText="Nombre" sortBy="#{product.name}" filterBy="#{product.name}">
                        <h:outputText value="#{product.name}"/>
                    </p:column>

                    <p:column headerText="Categoría" sortBy="#{product.category.name}">
                        <h:outputText value="#{product.category.name}"/>
                    </p:column>

                    <p:column headerText="Marca" sortBy="#{product.brand.name}">
                        <h:outputText value="#{product.brand.name}"/>
                    </p:column>

                    <p:column headerText="Price">
                        <h:outputText value="#{product.getCurrentPrice()}">
                            <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Estado">
                        <p:tag value="#{product.status}" severity="#{product.active ? 'success' : 'danger'}"/>
                    </p:column>

                    <p:column exportable="false" headerText="Acciones">
                        <p:commandButton icon="pi pi-pencil"
                                         update=":mainTabs:dialogs:manage-product-content :mainTabs:dialogs:dialog-footer"
                                         oncomplete="PF('manageProductDialog').show()"
                                         styleClass="edit-button rounded-button ui-button-success"
                                         process="@this"
                                         style="margin-right: .5rem"
                                         actionListener="#{productController.selectProductForEdit(product)}">
                        </p:commandButton>

                        <p:commandButton icon="pi pi-dollar"
                                         styleClass="rounded-button ui-button-secondary ui-button-outlined"
                                         style="margin-right: .5rem"
                                         actionListener="#{productPriceController.loadPrices(product.id)}"
                                         update=":mainTabs:priceDialogForm"
                                         oncomplete="PF('managePricesDialog').show()"
                                         process="@this">
                        </p:commandButton>

                        <p:commandButton class="ui-button-danger rounded-button" icon="pi pi-trash" process="@this"
                                         oncomplete="PF('deleteProductDialog').show()">
                            <f:setPropertyActionListener value="#{product}" target="#{productController.currentProduct}" />
                        </p:commandButton>


                    </p:column>

                </p:dataTable>
            </div>
        </h:form>

        <h:form id="dialogs">
            <p:confirmDialog widgetVar="deleteProductDialog" showEffect="fade" width="300"
                             message="¿Está seguro de eliminar este producto?" header="Confirmar" severity="warn">
                <p:commandButton value="Sí" icon="pi pi-check"
                                 actionListener="#{productController.onDeleteProduct}"
                                 process="@this"
                                 oncomplete="PF('deleteProductDialog').hide()"
                                 update=":mainTabs:form:dt-products :mainTabs:form:messages" />
                <p:commandButton value="No" type="button"
                                 styleClass="ui-button-secondary" icon="pi pi-times"
                                 onclick="PF('deleteProductDialog').hide()" />
            </p:confirmDialog>

            <p:dialog header="Product Details" showEffect="fade" modal="true"
                      widgetVar="manageProductDialog" responsive="true" width="500">
                <p:outputPanel id="manage-product-content" class="ui-fluid">
                    <p:outputPanel rendered="#{not empty productController.currentProduct}">

                        <div class="field">
                            <p:outputLabel for="sku">SKU</p:outputLabel>
                            <p:inputText id="sku" value="#{productController.currentProduct.sku}"
                                         required="true"
                                         disabled="#{productController.currentProduct.id != null}"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="name">Name</p:outputLabel>
                            <p:inputText id="name" value="#{productController.currentProduct.name}" required="true"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="description">Description</p:outputLabel>
                            <p:inputTextarea id="description" value="#{productController.currentProduct.description}"/>
                        </div>

                        <div class="field">
                            <p:outputLabel for="brand">Brand</p:outputLabel>
                            <p:selectOneMenu id="brand" value="#{productController.selectedBrandId}" required="true">
                                <f:selectItem itemLabel="Select a Brand" itemValue=""/>
                                <f:selectItems value="#{productController.brands}" var="b"
                                               itemLabel="#{b.name}" itemValue="#{b.id}"/>
                            </p:selectOneMenu>
                        </div>

                        <div class="field">
                            <p:outputLabel for="category">Category</p:outputLabel>
                            <p:selectOneMenu id="category" value="#{productController.selectedCategoryId}" required="true">
                                <f:selectItem itemLabel="Select a Category" itemValue=""/>
                                <f:selectItems value="#{productController.categories}" var="c"
                                               itemLabel="#{c.name}" itemValue="#{c.id}"/>
                            </p:selectOneMenu>
                        </div>

                        <div class="field">
                            <p:outputLabel for="price" rendered="#{productController.currentProduct.id == null}">Initial Price</p:outputLabel>
                            <p:inputNumber id="price" value="#{productController.initialPrice}"
                                           symbol="$" symbolPosition="p"
                                           decimalSeparator="." thousandSeparator=","
                                           rendered="#{productController.currentProduct.id == null}" required="true"/>
                        </div>

                    </p:outputPanel>
                </p:outputPanel>

                <f:facet name="footer">
                    <h:panelGroup id="dialog-footer">
                        <p:commandButton value="Save" icon="pi pi-check"
                                         rendered="#{productController.currentProduct.id == null}"
                                         actionListener="#{productController.saveProduct}"
                                         update="manage-product-content :mainTabs:form:dt-products :mainTabs:form:messages"
                                         process="manage-product-content @this"/>

                        <p:commandButton value="Update" icon="pi pi-check"
                                         rendered="#{productController.currentProduct.id != null}"
                                         actionListener="#{productController.onEditProduct}"
                                         update="manage-product-content :mainTabs:form:dt-products :mainTabs:form:messages"
                                         process="manage-product-content @this"/>

                        <p:commandButton value="Cancel" icon="pi pi-times"
                                         onclick="PF('manageProductDialog').hide()" class="ui-button-secondary"/>
                    </h:panelGroup>
                </f:facet>
            </p:dialog>
        </h:form>

        <p:dialog header="Historial de Precios" showEffect="fade" modal="true"
                  widgetVar="managePricesDialog" responsive="true" width="700">

            <h:form id="priceDialogForm">
                <p:growl id="priceMsg" showDetail="true"/>

                <p:panel header="Asignar Nuevo Precio" styleClass="mb-3" toggleable="true">
                    <div class="ui-fluid formgrid grid">
                        <div class="field col-12 md:6">
                            <p:outputLabel for="newPrice" value="Monto" />
                            <p:inputNumber id="newPrice" value="#{productPriceController.newAmount}"
                                           symbol="$" symbolPosition="p" decimalSeparator="." thousandSeparator=","
                                           required="true"/>
                        </div>
                        <div class="field col-12 md:6">
                            <p:outputLabel for="priceType" value="Tipo de Precio" />
                            <p:selectOneMenu id="priceType" value="#{productPriceController.newType}">
                                <f:selectItems value="#{productPriceController.priceTypes}" var="type"
                                               itemLabel="#{type.description}" itemValue="#{type}"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="field col-12 md:6">
                            <p:outputLabel for="validFrom" value="Válido Desde" />
                            <p:datePicker id="validFrom" value="#{productPriceController.newValidFrom}"
                                          showTime="true" pattern="dd/MM/yyyy HH:mm"/>
                        </div>
                        <div class="field col-12 md:6">
                            <p:outputLabel for="validTo" value="Válido Hasta (Opcional)" />
                            <p:datePicker id="validTo" value="#{productPriceController.newValidTo}"
                                          showTime="true" pattern="dd/MM/yyyy HH:mm"/>
                        </div>
                        <div class="col-12">
                            <p:commandButton value="Agregar Precio" icon="pi pi-plus"
                                             actionListener="#{productPriceController.addPrice}"
                                             update="priceTable priceMsg @parent"
                                             process="@form"/>
                        </div>
                    </div>
                </p:panel>

                <p:divider />

                <p:dataTable id="priceTable" var="price" value="#{productPriceController.priceHistory}"
                             paginator="true" rows="5" size="small" stripedRows="true">

                    <f:facet name="header">
                        Historial de Precios (Lista)
                    </f:facet>

                    <p:column headerText="Precio">
                        <h:outputText value="#{price.price}">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Tipo">
                        <p:tag value="#{price.priceType}" severity="info"/>
                    </p:column>

                    <p:column headerText="Desde">
                        <h:outputText value="#{price.validFrom}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" type="localDateTime"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Hasta">
                        <h:outputText value="#{price.validTo == null ? 'Indefinido' : price.validTo}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" type="localDateTime"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Estado">
                        <p:tag value="#{price.active ? 'ACTIVO' : 'INACTIVO'}"
                               severity="#{price.active ? 'success' : 'warning'}"/>
                    </p:column>

                </p:dataTable>

            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
