<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="template.xhtml"> <ui:define name="content">
    <div class="card">
        <h1>Listado de Productos</h1>

        <h:form>
            <p:dataTable var="product" value="#{productController.products}"
                         stripedRows="true" paginator="true" rows="10">

                <p:column headerText="SKU" sortBy="#{product.sku}">
                    <h:outputText value="#{product.sku}"/>
                </p:column>

                <p:column headerText="Nombre" sortBy="#{product.name}">
                    <h:outputText value="#{product.name}"/>
                </p:column>

                <p:column headerText="Categoría">
                    <h:outputText value="#{product.category.name}"/>
                </p:column>

                <p:column headerText="Estado">
                    <p:tag value="#{product.status}" severity="#{product.active ? 'success' : 'danger'}"/>
                </p:column>

            </p:dataTable>
        </h:form>
    </div>
</ui:define>
</ui:composition>
