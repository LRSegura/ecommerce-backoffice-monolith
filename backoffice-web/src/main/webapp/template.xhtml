<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Ecommerce Backoffice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <style>
        /* Reset básico */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f9;
        }

        /* Estructura CSS Grid */
        .layout-wrapper {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer";
            grid-template-rows: 60px 1fr 40px; /* Altura Header, Contenido (flexible), Altura Footer */
            grid-template-columns: 260px 1fr; /* Ancho Sidebar, Contenido (flexible) */
            height: 100vh;
        }

        /* 1. Header */
        .layout-header {
            grid-area: header;
            background-color: #3B82F6; /* Azul agradable */
            color: white;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .layout-header h2 { margin: 0; font-size: 1.5rem; }

        /* 2. Menu Lateral (Sidebar) */
        .layout-sidebar {
            grid-area: sidebar;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 1rem 0;
            overflow-y: auto;
        }
        /* Ajustes para quitar bordes extra al p:menu dentro del sidebar */
        .layout-sidebar .ui-menu {
            width: 100%;
            border: none;
            background: transparent;
        }

        /* 3. Contenido Principal */
        .layout-content {
            grid-area: content;
            padding: 1.5rem;
            overflow-y: auto;
            background-color: #f8f9fa;
        }

        /* 4. Footer */
        .layout-footer {
            grid-area: footer;
            background-color: #1F2937; /* Gris oscuro / Azul noche */
            color: #ecf0f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        /* Ajustes de PrimeFaces */
        .card {
            background: #ffffff;
            padding: 1rem;
            border-radius: 4px;
            box-shadow: 0 2px 1px -1px rgba(0,0,0,0.2), 0 1px 1px 0 rgba(0,0,0,0.14), 0 1px 3px 0 rgba(0,0,0,0.12);
        }

        /* --- Estilos para Formularios en Dialogs --- */

        /* Contenedor de cada campo */
        .field {
            margin-bottom: 1.5rem; /* Espacio vertical generoso entre cada grupo */
        }

        /* Estilo de la Etiqueta (Label) */
        .field > label {
            display: block;        /* Fuerza al label a ocupar su propia línea (arriba del input) */
            margin-bottom: 0.5rem; /* Espacio entre el texto del label y el input */
            font-weight: 600;      /* Texto un poco más grueso para jerarquía */
            color: #374151;        /* Un gris oscuro profesional (no negro puro) */
        }

        /* Ajuste opcional para TextAreas para que no queden pegados */
        .ui-inputtextarea {
            width: 100%;
        }


        .ui-inputfield {
            background-color: #f9fafb; /* Fondo muy sutil */
        }
        .ui-inputfield:focus {
            background-color: #ffffff; /* Blanco al escribir */
            border-color: #3B82F6;     /* Borde azul al enfocar */
        }

    </style>
</h:head>

<h:body>
    <div class="layout-wrapper">

        <header class="layout-header">
            <h2>Admin Console</h2>
        </header>

        <aside class="layout-sidebar">
            <h:form>
                <p:menu>
                    <p:submenu label="Catálogo">
                        <p:menuitem value="Productos" outcome="/products" icon="pi pi-box"/>
                        <p:menuitem value="Marcas" outcome="/brands" icon="pi pi-tag"/>
                        <p:menuitem value="Categorías" outcome="/categories" icon="pi pi-list"/>
                    </p:submenu>

                    <p:submenu label="Sistema">
                        <p:menuitem value="Configuración" icon="pi pi-cog" url="#"/>
                        <p:menuitem value="Logout" icon="pi pi-power-off" url="#"/>
                    </p:submenu>
                </p:menu>
            </h:form>
        </aside>

        <main class="layout-content">
            <p:tabView id="mainTabs">

                <p:tab title="Gestión de Datos">
                    <ui:insert name="content">
                        Contenido por defecto si no se carga ninguna página.
                    </ui:insert>
                </p:tab>

                <p:tab title="Información / Auditoría">
                    <div class="card">
                        <h3>Información del Módulo</h3>
                        <p>Aquí se puede mostrar estadísticas rápidas, historial de cambios recientes o documentación de ayuda para la pantalla actual.</p>
                        <p:divider />
                        <p:staticMessage severity="info" summary="Estado del Sistema" detail="Todos los servicios operativos." style="width: 100%"/>
                    </div>
                </p:tab>

            </p:tabView>
        </main>

        <footer class="layout-footer">
            <span>Ecommerce Backoffice © 2026 - Code2Ever</span>
        </footer>

    </div>
</h:body>
</html>
