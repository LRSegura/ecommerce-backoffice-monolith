<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="template.xhtml">

    <ui:define name="content">
        <h:form id="form">
            <p:growl id="messages" showDetail="true"/>

            <div class="card">
                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton value="New Category" icon="pi pi-plus"
                                         actionListener="#{categoryController.prepareNewCategory}"
                                         update=":dialogs:manage-category-content :dialogs:dialog-footer"
                                         oncomplete="PF('manageCategoryDialog').show()"
                                         styleClass="ui-button-success" style="margin-right: .5rem"/>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="dt-categories" var="category" value="#{categoryController.categories}"
                             widgetVar="dtCategories" rowKey="#{category.id}" paginator="true" rows="10">

                    <p:column headerText="ID">
                        <h:outputText value="#{category.id}"/>
                    </p:column>

                    <p:column headerText="Nombre" sortBy="#{category.name}" filterBy="#{category.name}">
                        <h:outputText value="#{category.name}"/>
                    </p:column>

                    <p:column headerText="Estado">
                        <p:tag value="#{category.active ? 'ACTIVO' : 'INACTIVO'}"
                               severity="#{category.active ? 'success' : 'danger'}"/>
                    </p:column>

                    <p:column exportable="false">
                        <p:commandButton icon="pi pi-pencil"
                                         update=":dialogs:manage-category-content :dialogs:dialog-footer"
                                         oncomplete="PF('manageCategoryDialog').show()"
                                         styleClass="edit-button rounded-button ui-button-success"
                                         process="@this"
                                         style="margin-right: .5rem">
                            <f:setPropertyActionListener value="#{category}" target="#{categoryController.currentCategory}"/>
                        </p:commandButton>

                        <p:commandButton class="ui-button-danger rounded-button" icon="pi pi-trash" process="@this"
                                         oncomplete="PF('deleteCategoryDialog').show()">
                            <f:setPropertyActionListener value="#{category}" target="#{categoryController.currentCategory}" />
                        </p:commandButton>
                    </p:column>

                </p:dataTable>
            </div>
        </h:form>

        <h:form id="dialogs">
            <p:confirmDialog widgetVar="deleteCategoryDialog" showEffect="fade" width="300"
                             message="¿Está seguro de eliminar esta categoría?" header="Confirmar" severity="warn">
                <p:commandButton value="Sí" icon="pi pi-check"
                                 actionListener="#{categoryController.onDeleteCategory}"
                                 process="@this"
                                 oncomplete="PF('deleteCategoryDialog').hide()"
                                 update=":form:dt-categories :form:messages" />
                <p:commandButton value="No" type="button"
                                 styleClass="ui-button-secondary" icon="pi pi-times"
                                 onclick="PF('deleteCategoryDialog').hide()" />
            </p:confirmDialog>

            <p:dialog header="Category Details" showEffect="fade" modal="true"
                      widgetVar="manageCategoryDialog" responsive="true">
                <p:outputPanel id="manage-category-content" class="ui-fluid">
                    <p:outputPanel rendered="#{not empty categoryController.currentCategory}">
                        <div class="field">
                            <p:outputLabel for="name">Name</p:outputLabel>
                            <p:inputText id="name" value="#{categoryController.currentCategory.name}" required="true"/>
                        </div>
                        <div class="field">
                            <p:outputLabel for="active" style="display:block; margin-top:10px">Active</p:outputLabel>
                            <p:toggleSwitch id="active" value="#{categoryController.currentCategory.active}"/>
                        </div>
                    </p:outputPanel>
                </p:outputPanel>

                <f:facet name="footer">
                    <h:panelGroup id="dialog-footer">
                        <p:commandButton value="Save" icon="pi pi-check"
                                         rendered="#{categoryController.currentCategory.id == null}"
                                         actionListener="#{categoryController.saveCategory}"
                                         update="manage-category-content :form:dt-categories :form:messages"
                                         process="manage-category-content @this"/>
                        <p:commandButton value="Update" icon="pi pi-check"
                                         rendered="#{categoryController.currentCategory.id != null}"
                                         actionListener="#{categoryController.onEditCategory}"
                                         update="manage-category-content :form:dt-categories :form:messages"
                                         process="manage-category-content @this"/>
                        <p:commandButton value="Cancel" icon="pi pi-times"
                                         onclick="PF('manageCategoryDialog').hide()" class="ui-button-secondary"/>
                    </h:panelGroup>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
